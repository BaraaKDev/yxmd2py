name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact tags only - no floating v10 major tag exists.
      - uses: astral-sh/setup-uv@v10.0.1
      # uv reads .python-version and provisions the interpreter itself.
      - run: uv sync
      - run: uv run pytest
